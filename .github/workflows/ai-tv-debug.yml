name: Android TV debug APK
on:
  push:
    branches: [feature/ai-tv-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build environment diagnostics
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -l gradlew gradle/wrapper/gradle-wrapper.jar
          bash ./gradlew --version
      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ai-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
