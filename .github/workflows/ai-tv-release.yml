name: AI TV signed release
on:
  workflow_dispatch:
  push:
    tags:
      - 'ai-tv-v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.AI_TV_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AI_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AI_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AI_TV_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ai-tv-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/ai-tv-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > release.properties
      - name: Build release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify APK and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$RELEASE_TAG" = "ai-tv-v$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" ai-tv.apk
          sha256sum ai-tv.apk > ai-tv.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ai-tv.apk ai-tv.apk.sha256 --title "AI TV $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Cleanup secrets
        if: always()
        run: rm -f release.properties "$RUNNER_TEMP/ai-tv-release.jks"
