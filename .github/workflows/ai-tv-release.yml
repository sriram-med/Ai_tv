name: AI TV signed release
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-tv-2-native-gpt
    tags:
      - 'ai-tv-v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.AI_TV_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AI_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AI_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AI_TV_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ai-tv-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/ai-tv-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > release.properties
      - name: Test gateway
        run: |
          node --check ai-gateway/server.mjs
          cd ai-gateway
          npm install --omit=dev
          npm test
      - name: Compile Android debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Check release signing configuration
        run: |
          test -f release.properties
          test -s "$RUNNER_TEMP/ai-tv-release.jks"
      - name: Build release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify APK and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = branch -o "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_TYPE" = branch || test "$RELEASE_TAG" = "ai-tv-v$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" ai-tv.apk
          sha256sum ai-tv.apk > ai-tv.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk '$1 == "versionName" {gsub(/\047/, "", $2); print $2; exit}' app/build.gradle)
          test "$VERSION" = "1.2.12"
          TAG="ai-tv-v$VERSION"
          test -n "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping published APK immutable."
            echo "Increment versionName and versionCode for the next public release."
            exit 0
          fi
          gh release create "$TAG" ai-tv.apk ai-tv.apk.sha256 --target "$GITHUB_SHA" --title "AI TV $TAG" --generate-notes
      - name: Cleanup secrets
        if: always()
        run: rm -f release.properties "$RUNNER_TEMP/ai-tv-release.jks"
