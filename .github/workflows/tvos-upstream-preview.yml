name: AI TV upstream tvOS migration preview
on:
  workflow_dispatch:
  push:
    branches:
      - feature/tvos-upstream-migration
permissions:
  contents: write
jobs:
  clone-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install upstream Android SDK dependencies
        run: |
          test -n "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Fetch pinned Apache-2.0 TV launcher
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/techgenius1/tvOS-Launcher.git upstream
          git -C upstream fetch --depth 1 origin 463fa6c2a9b7322c4407f1d00db935ef09d20f4f
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "463fa6c2a9b7322c4407f1d00db935ef09d20f4f"
          test -s upstream/LICENSE && test -s upstream/NOTICE
      - name: Port AI Discovery without replacing upstream layout
        run: |
          python3 integration/tvos/patch_upstream.py
          cp app/src/main/java/com/techpp/glass/AiTvPairingClient.java upstream/src/com/techpp/glass/
          cp app/src/main/java/com/techpp/glass/AiRecommendationClient.java upstream/src/com/techpp/glass/
          test -f upstream/src/com/techpp/glass/SearchPanel.java
          grep -q 'AI MOVIES' upstream/src/com/techpp/glass/SearchPanel.java
          grep -q 'aiTvButton' upstream/src/com/techpp/glass/MainActivity.java
      - name: Build real cloned launcher (upstream shell and animations)
        env:
          VERSION_NAME: 1.7.0
          VERSION_CODE: 41
        run: |
          cd upstream
          bash build.sh
          test -s build/aligned.apk
      - name: Sign using existing AI TV release key
        env:
          KEYSTORE_B64: ${{ secrets.AI_TV_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AI_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AI_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AI_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/preview-key.jks"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/preview-key.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out ai-tv-upstream-preview.apk upstream/build/aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs ai-tv-upstream-preview.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging ai-tv-upstream-preview.apk | head -5
          sha256sum ai-tv-upstream-preview.apk > ai-tv-upstream-preview.apk.sha256
      - name: Upload preview APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: ai-tv-upstream-preview
          path: |
            ai-tv-upstream-preview.apk
            ai-tv-upstream-preview.apk.sha256
      - name: Publish pre-release only after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ai-tv-v1.7.0-oss-preview"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing immutable preview left intact."
            exit 0
          fi
          gh release create "$TAG" ai-tv-upstream-preview.apk ai-tv-upstream-preview.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "AI TV 1.7.0 — upstream tvOS migration preview" \
            --notes "Preview only: cloned from techgenius1/tvOS-Launcher commit 463fa6c (Apache-2.0). The real upstream glass dock, TV UI, motion, native search posters, provider logos, IMDb badges, and AI discovery pairing are preserved/extended. Not TV-tested. Do not disable OEM Home launcher."
      - name: Cleanup release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/preview-key.jks"
