name: AI TV 2.2.0 hotfix full APK
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - release/ai-tv-1.8.0
permissions:
  contents: write
concurrency:
  group: ai-tv-v2.2.0-stable
  cancel-in-progress: true
jobs:
  full-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ai-tv-1.8.0
      - name: Load pinned upstream version
        run: |
          python3 - <<'PYCONFIG' >> "$GITHUB_ENV"
          import json
          c=json.load(open("integration/tvos/upstream.json"))
          for k,v in {"UPSTREAM_SHA":c["sha"],"VERSION_NAME":c["version"],"VERSION_CODE":c["versionCode"]}.items(): print(f"{k}={v}")
          PYCONFIG
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: |
          set -euo pipefail
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Clone original licensed tvOS launcher (pinned)
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/techgenius1/tvOS-Launcher.git upstream
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -s upstream/LICENSE && test -s upstream/NOTICE
      - name: Integrate TV-safe AI discovery and signed update channel
        run: |
          set -euo pipefail
          python3 integration/tvos/patch_upstream.py
          cp app/src/main/java/com/techpp/glass/AiTvPairingClient.java upstream/src/com/techpp/glass/
          cp app/src/main/java/com/techpp/glass/AiRecommendationClient.java upstream/src/com/techpp/glass/
          grep -q 'aiSceneButton' upstream/src/com/techpp/glass/SceneHome.java
          grep -q 'openAiChooser' upstream/src/com/techpp/glass/SearchPanel.java
          grep -q 'showCuratedPicks' upstream/src/com/techpp/glass/SearchPanel.java
          grep -q 'sriram-med/Ai_tv/releases/latest' upstream/src/com/techpp/glass/AppUpdater.java
          grep -q 'if (false)' upstream/src/com/techpp/glass/SettingsActivity.java
          test -s upstream/NOTICE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cloned Recommenders model parity
        run: |
          python3 -m pip install numpy pandas scikit-learn
          python3 integration/tvos/tests/check_recommenders.py
      - name: Test independent catalog fallback and offline cache
        env:
          JSON_JAR: /tmp/ai-tv-json.jar
        run: |
          curl -fL --retry 3 -o "$JSON_JAR" https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  $JSON_JAR" | sha256sum -c -
          python3 integration/tvos/tests/check_catalog.py
      - name: Test generated AI navigation and release comparisons
        run: python3 integration/tvos/tests/check_navigation.py
      - name: Build original full Android TV application
        run: |
          cd upstream
          bash build.sh
          test -s build/aligned.apk
      - name: Sign AI TV stable APK with retained production key
        env:
          KEYSTORE_B64: ${{ secrets.AI_TV_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AI_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AI_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AI_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          python3 - <<'PY'
          import os,base64,re
          secret=os.environ["KEYSTORE_B64"].strip().strip('"').strip("'")
          secret=secret.replace(r"\n","").replace(r"\r","")
          if secret.lower().startswith("data:") and "base64," in secret.lower():
              secret=secret.split(",",1)[1]
          secret=re.sub(r"\s+","",secret)
          try:
              decoded=base64.b64decode(secret+"="*((-len(secret))%4),altchars=b"-_",validate=True)
          except Exception:
              raise SystemExit("Release keystore secret is not valid Base64. Restore AI_TV_RELEASE_KEYSTORE_B64 in repository Actions secrets.")
          if len(decoded)<128:
              raise SystemExit("Decoded signing keystore is unexpectedly short; do not publish.")
          with open(os.path.join(os.environ["RUNNER_TEMP"],"ai-tv-stable.jks"),"wb") as f:
              f.write(decoded)
          print("Keystore decoded successfully; validating with signing tool.")
          PY
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ai-tv-stable.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out ai-tv.apk upstream/build/aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs ai-tv.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging ai-tv.apk | grep "^package: name='com.techpp.glass' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          sha256sum ai-tv.apk > ai-tv.apk.sha256
          cp upstream/LICENSE UPSTREAM-LICENSE.txt
          cp upstream/NOTICE UPSTREAM-NOTICE.txt
          cp vendor/recommenders/LICENSE RECOMMENDERS-LICENSE.txt
      - name: Verify upgrade signing against installed preview
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/previous-preview.apk" \
            https://github.com/sriram-med/Ai_tv/releases/download/ai-tv-v1.7.4-oss-preview/ai-tv-upstream-preview.apk
          OLD=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/previous-preview.apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')
          NEW=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs ai-tv.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')
          test -n "$OLD" && test "$OLD" = "$NEW"
          echo "Existing-preview signing key matches stable APK."
      - name: Upload stable signed APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: ai-tv-v2.2.0-signed
          path: |
            ai-tv.apk
            ai-tv.apk.sha256
            UPSTREAM-LICENSE.txt
            UPSTREAM-NOTICE.txt
            RECOMMENDERS-LICENSE.txt
      - name: Build Nuvio variant discovery probe
        run: bash integration/tvos/tests/build_nuvio_probe.sh
      - name: Enable hardware acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Boot Android TV and test signed preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            set -eu
            curl -fL --retry 3 -o /tmp/ai-tv-upstream-preview.apk "https://github.com/sriram-med/Ai_tv/releases/download/ai-tv-v1.7.4-oss-preview/ai-tv-upstream-preview.apk"
            adb install -r /tmp/ai-tv-upstream-preview.apk
            cp ai-tv.apk /tmp/ai-tv-hotfix.apk
            adb install -r /tmp/ai-tv-hotfix.apk
            adb shell dumpsys package com.techpp.glass | grep "versionName=$VERSION_NAME"
            adb shell am start -W -n com.techpp.glass/com.techpp.glass.MainActivity
            sleep 5
            mkdir -p tv-preview-shots
            adb shell screencap -p /sdcard/ai-tv-home.png
            adb pull /sdcard/ai-tv-home.png tv-preview-shots/home.png
            adb shell input keyevent 22
            adb shell input keyevent 23
            sleep 2
            adb shell input keyevent 4
            sleep 2
            adb shell screencap -p /sdcard/ai-tv-after-dpad.png
            adb pull /sdcard/ai-tv-after-dpad.png tv-preview-shots/after-dpad.png
            python3 integration/tvos/tests/open_ai_smoke.py
            python3 integration/tvos/tests/check_regional_ui.py
            python3 integration/tvos/tests/check_ai_layout.py
            python3 integration/tvos/tests/check_nuvio_installed.py
            sleep 2
            adb shell screencap -p /sdcard/ai-tv-ai-discovery.png
            adb pull /sdcard/ai-tv-ai-discovery.png tv-preview-shots/ai-discovery-entry.png
            adb logcat -d -v brief > tv-preview-shots/logcat.txt
            ! grep -q 'Process: com.techpp.glass' tv-preview-shots/logcat.txt
            adb shell dumpsys activity activities | grep 'com.techpp.glass' || true
      - name: Upload TV UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-studio-tv-evidence
          path: tv-preview-shots/
      - name: Publish normal production GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ai-tv-v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing stable release remains immutable"
            exit 0
          fi
          gh release create "$TAG" ai-tv.apk ai-tv.apk.sha256 UPSTREAM-LICENSE.txt UPSTREAM-NOTICE.txt RECOMMENDERS-LICENSE.txt \
            --target "$GITHUB_SHA" \
            --title "AI TV $VERSION_NAME — tvOS + AI Studio" \
            --latest \
            --notes "Built from pinned tvOS Launcher with AI TV additions and the retained signing key. Native dark AI Studio, mood controls, language filters, Nuvio variant discovery, bounded 3D focus animations and lighter recommendation rails. Automatic updates use only this signed AI TV channel. Android may request installation permission or confirmation. Open-source notices included."
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-tv-stable.jks"
