name: AI TV 1.8.4 hotfix full APK
on:
  workflow_dispatch:
  push:
    branches:
      - release/ai-tv-1.8.0
permissions:
  contents: write
concurrency:
  group: ai-tv-v1.8.4-stable
  cancel-in-progress: true
jobs:
  full-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: |
          set -euo pipefail
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Clone original licensed tvOS launcher (pinned)
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/techgenius1/tvOS-Launcher.git upstream
          git -C upstream fetch --depth 1 origin 463fa6c2a9b7322c4407f1d00db935ef09d20f4f
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "463fa6c2a9b7322c4407f1d00db935ef09d20f4f"
          test -s upstream/LICENSE && test -s upstream/NOTICE
      - name: Integrate TV-safe AI discovery and signed update channel
        run: |
          set -euo pipefail
          python3 integration/tvos/patch_upstream.py
          cp app/src/main/java/com/techpp/glass/AiTvPairingClient.java upstream/src/com/techpp/glass/
          cp app/src/main/java/com/techpp/glass/AiRecommendationClient.java upstream/src/com/techpp/glass/
          grep -q 'aiSceneButton' upstream/src/com/techpp/glass/SceneHome.java
          grep -q 'openAiChooser' upstream/src/com/techpp/glass/SearchPanel.java
          grep -q 'showCuratedPicks' upstream/src/com/techpp/glass/SearchPanel.java
          grep -q 'sriram-med/Ai_tv/releases/latest' upstream/src/com/techpp/glass/AppUpdater.java
          grep -q 'if (false)' upstream/src/com/techpp/glass/SettingsActivity.java
          test -s upstream/NOTICE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cloned Recommenders model parity
        run: |
          python3 -m pip install numpy pandas scikit-learn
          python3 integration/tvos/tests/check_recommenders.py
      - name: Test generated AI navigation and release comparisons
        run: python3 integration/tvos/tests/check_navigation.py
      - name: Build original full Android TV application
        env:
          VERSION_NAME: 1.8.4
          VERSION_CODE: 50
        run: |
          cd upstream
          bash build.sh
          test -s build/aligned.apk
      - name: Sign AI TV stable APK with retained production key
        env:
          KEYSTORE_B64: ${{ secrets.AI_TV_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AI_TV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AI_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AI_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          python3 - <<'PY'
          import os,base64,re
          secret=os.environ["KEYSTORE_B64"].strip().strip('"').strip("'")
          secret=secret.replace(r"\n","").replace(r"\r","")
          if secret.lower().startswith("data:") and "base64," in secret.lower():
              secret=secret.split(",",1)[1]
          secret=re.sub(r"\s+","",secret)
          try:
              decoded=base64.b64decode(secret+"="*((-len(secret))%4),altchars=b"-_",validate=True)
          except Exception:
              raise SystemExit("Release keystore secret is not valid Base64. Restore AI_TV_RELEASE_KEYSTORE_B64 in repository Actions secrets.")
          if len(decoded)<128:
              raise SystemExit("Decoded signing keystore is unexpectedly short; do not publish.")
          with open(os.path.join(os.environ["RUNNER_TEMP"],"ai-tv-stable.jks"),"wb") as f:
              f.write(decoded)
          print("Keystore decoded successfully; validating with signing tool.")
          PY
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ai-tv-stable.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out ai-tv.apk upstream/build/aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs ai-tv.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging ai-tv.apk | grep "^package: name='com.techpp.glass' versionCode='50' versionName='1.8.4'"
          sha256sum ai-tv.apk > ai-tv.apk.sha256
          cp upstream/LICENSE UPSTREAM-LICENSE.txt
          cp upstream/NOTICE UPSTREAM-NOTICE.txt
          cp vendor/recommenders/LICENSE RECOMMENDERS-LICENSE.txt
      - name: Verify upgrade signing against installed preview
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/previous-preview.apk" \
            https://github.com/sriram-med/Ai_tv/releases/download/ai-tv-v1.7.4-oss-preview/ai-tv-upstream-preview.apk
          OLD=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/previous-preview.apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')
          NEW=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs ai-tv.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')
          test -n "$OLD" && test "$OLD" = "$NEW"
          echo "Existing-preview signing key matches stable APK."
      - name: Upload stable signed APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: ai-tv-v1.8.4-signed
          path: |
            ai-tv.apk
            ai-tv.apk.sha256
            UPSTREAM-LICENSE.txt
            UPSTREAM-NOTICE.txt
            RECOMMENDERS-LICENSE.txt
      - name: Publish normal production GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ai-tv-v1.8.4"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing stable release remains immutable"
            exit 0
          fi
          gh release create "$TAG" ai-tv.apk ai-tv.apk.sha256 UPSTREAM-LICENSE.txt UPSTREAM-NOTICE.txt RECOMMENDERS-LICENSE.txt \
            --target "$GITHUB_SHA" \
            --title "AI TV 1.8.4 — Native Recommenders" \
            --latest \
            --notes "Integrates the content-based TF-IDF / cosine ranking algorithm from recommenders-team/recommenders, cloned at cc47866b0599721f8544d1cc850a5a1db091acb3. Native Android adaptation is tested for numeric parity against the original Python model. Recommendations rank title/overview metadata directly on the TV; no GPT key, pairing setup, paid inference, or recommendation-server account is needed. Removed Connect GPT and its pairing popup. Recommend replaces GPT Rank. AI opens recommendation rails directly, with persistent search and QWERTY keyboard. Catalog retrieval still needs internet. This is content-based ranking, not a collaborative model trained on viewing history. Version 1.8.4 code 50. Signed with the retained production key. Apache-2.0 upstream launcher and MIT Recommenders notices included."
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-tv-stable.jks"
